# Keep this host isolated while inactive and after the signing window closes.
server {
    listen 80;
    server_name sign.centralbankofbitcoin.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cbob-signing-acme;
        try_files $uri =404;
    }
    location / { return 301 https://sign.centralbankofbitcoin.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name sign.centralbankofbitcoin.com;
    ssl_certificate /etc/letsencrypt/live/sign.centralbankofbitcoin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sign.centralbankofbitcoin.com/privkey.pem;
    add_header Cache-Control "no-store, no-transform" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / { return 404; }
}
