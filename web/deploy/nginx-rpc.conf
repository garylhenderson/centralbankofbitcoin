# THE SAME-ORIGIN RPC ENDPOINT, https://centralbankofbitcoin.com/rpc
# STAGED, NOT INSTALLED (web/README.md, "Enabling the RPC proxy").
#
# nginx cannot read a request body to check JSON-RPC methods without njs or lua,
# so the method allowlist lives in web/deploy/rpc-proxy.mjs (loopback :8789), and
# this block only puts TLS, a per-IP rate limit and a body cap in front of it.
# The upstream provider URL (and its key) is NOT here and NOT in the repository:
# it is in the proxy's mode-600 env file, /etc/cbob/rpc-proxy.env.
#
# 1. In the http {} context (for example /etc/nginx/conf.d/cbob-rpc-zone.conf):
#
#      limit_req_zone $binary_remote_addr zone=cbob_rpc:10m rate=10r/s;
#
# 2. Inside the centralbankofbitcoin.com server {} block (TLS already there):

location = /rpc {
    limit_except POST { deny all; }          # POST only (GET and HEAD are refused too)
    client_max_body_size 16k;                # the proxy enforces the same cap
    client_body_buffer_size 16k;
    limit_req zone=cbob_rpc burst=60 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;  # the proxy trusts this only from loopback
    proxy_set_header Cookie "";               # nothing about the visitor goes upstream
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_buffering on;

    # Same-origin only: never add Access-Control-Allow-Origin here. Browsers then
    # refuse to hand a cross-site page the response, and the proxy also refuses a
    # request whose Origin is not https://centralbankofbitcoin.com.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
