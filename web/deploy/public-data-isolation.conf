[Service]
User=cbob-data
Group=cbob-data
SupplementaryGroups=
Environment=CBOB_DATA_STATE=/var/lib/cbob-public-data
BindReadOnlyPaths=/etc/cbob/public-data-reader.env:/opt/gary-club/.env.local
ReadWritePaths=/var/www/centralbankofbitcoin/data /var/www/centralbankofbitcoin/v /var/lib/cbob-public-data /scratch/cbob-vaults-cache/public-data.flock
ProtectSystem=strict
ReadOnlyPaths=/run
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
UMask=0022
