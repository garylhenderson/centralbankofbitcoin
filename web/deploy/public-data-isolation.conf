[Service]
User=cbob-data
Group=cbob-data
SupplementaryGroups=
Environment=CBOB_DATA_STATE=/var/lib/cbob-public-data
TemporaryFileSystem=/opt/gary-club:ro /opt/cbob-vaults:ro /scratch/cbob-vaults-cache:ro
BindReadOnlyPaths=/etc/cbob/public-data-reader.env:/opt/gary-club/.env.local /opt/gary-club/node_modules /opt/cbob-vaults/.git
BindPaths=/scratch/cbob-vaults-cache/public-data.flock:/opt/cbob-vaults/.cache/public-data.flock
ReadWritePaths=/var/www/centralbankofbitcoin/data /var/www/centralbankofbitcoin/v /var/lib/cbob-public-data /opt/cbob-vaults/.cache/public-data.flock
ProtectSystem=strict
ReadOnlyPaths=/run
InaccessiblePaths=-/opt/cbob-ceremony -/var/backups
IPAddressDeny=169.254.169.254 fd00:ec2::254
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
UMask=0022
