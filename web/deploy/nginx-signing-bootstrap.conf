# Certificate bootstrap only. No signing pages or upstream on this host yet.
server {
    listen 80;
    server_name sign.centralbankofbitcoin.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cbob-signing-acme;
        try_files $uri =404;
    }
    location / { return 404; }
}
