[Service]
User=cbob-reconcile
Group=cbob-reconcile
SupplementaryGroups=
BindReadOnlyPaths=/etc/cbob/reconcile-reader.env:/opt/gary-club/.env.local
ProtectSystem=strict
ReadOnlyPaths=/run
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
UMask=0077
