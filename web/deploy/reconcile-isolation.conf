[Service]
User=cbob-reconcile
Group=cbob-reconcile
SupplementaryGroups=
TemporaryFileSystem=/opt/gary-club:ro
BindReadOnlyPaths=/etc/cbob/reconcile-reader.env:/opt/gary-club/.env.local /opt/gary-club/scripts/cbob-reconcile.mjs
ProtectSystem=strict
ReadOnlyPaths=/run
InaccessiblePaths=-/opt/cbob-vaults -/scratch/cbob-vaults-cache -/opt/cbob-ceremony -/var/backups
IPAddressDeny=169.254.169.254
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
UMask=0077
