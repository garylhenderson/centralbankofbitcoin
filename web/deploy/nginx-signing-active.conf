# Install only after D2 and Claude delivery review. Dedicated DNS-only host.
# Issue its own publicly trusted certificate first; no copied apex certificate.
# No analytics, Gary Club routes, public documents or other scripts on this origin.
server {
    listen 80;
    server_name sign.centralbankofbitcoin.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cbob-signing-acme;
        try_files $uri =404;
    }
    location / { return 301 https://sign.centralbankofbitcoin.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name sign.centralbankofbitcoin.com;
    ssl_certificate /etc/letsencrypt/live/sign.centralbankofbitcoin.com/fullchain.pem;
    # This certificate has no OCSP responder; do not inherit global stapling.
    ssl_stapling off;
    ssl_certificate_key /etc/letsencrypt/live/sign.centralbankofbitcoin.com/privkey.pem;
    # Contains only the reviewed, unlisted authenticated ceremony location.
    include /etc/nginx/cbob-signing-location.conf;
    location / { return 404; }
}
