[package]
name = "cbob-vault-sweep"
version = "0.1.0"
description = "Central Bank of Bitcoin Vaults — sweep a redeeming vault's live balances, at the moment the redemption runs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cbob_vault_sweep"

[features]
default = []
# NO `localnet` feature, deliberately (round 25): a declared feature, even an
# empty one, enters the crate's metadata hash, which renames every symbol and
# reorders .text, so the tested build could never be byte-identical to the
# shipped one. Without it, the workspace's --features localnet build compiles
# this crate exactly as the mainnet build does (scripts/build-mainnet.sh cmp's it).
no-entrypoint = []

[dependencies]
solana-program = "=2.3.0"
