# THE VERIFIABLE BUILD, ON A MACHINE THAT IS NOT OURS (2026-10-10).
#
# Explorers and wallets mark a program "verified" when OtterSec rebuilds it from
# this public repository in Solana's verifiable-build container and gets the
# deployed bytes exactly. So the bytes we deploy must be the bytes that container
# makes. This workflow builds all five programs inside it, on GitHub's runner:
#   1. the whole workspace at once, as scripts/build-mainnet.sh builds it;
#   2. each program alone through solana-verify, as OtterSec will rebuild it;
#   3. the same two for the --features localnet build the test suite runs.
# Run it by pushing a tag `verify-<short sha>` at the commit, or by hand.
# It publishes every sha256. Equal hashes across the three, and with the box's
# own build, mean the deployed, verified and tested bytes are one set of bytes.
#
# Image: solanafoundation/solana-verifiable-build for Agave v4.1.0, whose
# Dockerfile installs cargo-build-sbf 4.1.0 with platform-tools v1.54: the exact
# toolchain scripts/run-tests.sh requires. The digest is solana-verify's own
# IMAGE_MAP entry for (4, 1, 0). It builds nothing that is deployed by itself.
name: verifiable-build
on:
  push:
    tags: ['verify-*']   # a pushed tag builds the commit it names
  workflow_dispatch:
    inputs:
      ref:
        description: commit to build
        required: true
permissions:
  contents: read
env:
  IMAGE: solanafoundation/solana-verifiable-build@sha256:6468b89ae21d87b8eb002f894ac3f3442dbd8bcf5ea93414051e96e00d03b5ab
  SOLANA_VERIFY_VERSION: 0.5.2
  LIBS: cbob_vaults cbob_vault_mint cbob_vault_burn cbob_vault_gov cbob_vault_sweep
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: record the commit
        run: git rev-parse HEAD | tee commit.txt
      - name: whole workspace in the container (as build-mainnet.sh builds)
        run: |
          docker pull "$IMAGE"
          for f in mainnet localnet; do
            FEAT=""; [ "$f" = localnet ] && FEAT="--features localnet"
            docker run --rm -v "$PWD":/build -w /build -e CARGO_TARGET_DIR=/build/target-ws-$f "$IMAGE" \
              bash -c "cargo build-sbf --tools-version v1.54 --arch v3 $FEAT" > ws-$f.log 2>&1 || { tail -40 ws-$f.log; exit 1; }
            mkdir -p out/logs out/workspace-$f && cp target-ws-$f/sbpfv3-solana-solana/release/*.so out/workspace-$f/
          done
          docker run --rm "$IMAGE" bash -c "cargo build-sbf --version" | tee out/toolchain.txt
      - name: install solana-verify
        run: cargo install solana-verify --version "$SOLANA_VERIFY_VERSION" --locked
      - name: "each program three ways, to find which reproduces the workspace build"
        run: |
          # A: as OtterSec rebuilds by default (one package via --manifest-path)
          # B: the same with `-- --workspace`, so cargo unifies features across all five
          # C: by hand in the container, one package from its own directory
          for L in $LIBS; do
            sudo rm -rf target   # the container builds as root
            solana-verify build --library-name "$L" --base-image "$IMAGE" --arch v3 > out/logs/sv-a-$L.log 2>&1 || echo "A $L BUILD FAILED" >> out/failures.txt
            mkdir -p out/sv-a && cp "target/deploy/$L.so" out/sv-a/ 2>/dev/null || true
            sudo rm -rf target   # the container builds as root
            solana-verify build --library-name "$L" --base-image "$IMAGE" --arch v3 -- --workspace > out/logs/sv-b-$L.log 2>&1 || echo "B $L BUILD FAILED" >> out/failures.txt
            mkdir -p out/sv-b && cp "target/deploy/$L.so" out/sv-b/ 2>/dev/null || true
          done
          for L in $LIBS; do
            D=programs/$(echo $L | tr _ -)
            sudo rm -rf target   # the container builds as root
            docker run --rm -v "$PWD":/build -w "/build/$D" "$IMAGE" bash -c "cargo build-sbf --tools-version v1.54 --arch v3" > out/logs/c-$L.log 2>&1 || echo "C $L BUILD FAILED" >> out/failures.txt
            mkdir -p out/c-per-package && cp "target/deploy/$L.so" out/c-per-package/ 2>/dev/null || true
          done
      - name: "hashes, reported and never a failure (a mismatch is a finding to read, not a broken run)"
        if: always()
        run: |
          cp commit.txt out/
          for d in out/workspace-mainnet out/workspace-localnet out/sv-a out/sv-b out/c-per-package; do ( cd "$d" && sha256sum *.so ) > "$d/SHA256SUMS" 2>/dev/null || true; done
          for d in out/workspace-mainnet out/workspace-localnet out/sv-a out/sv-b out/c-per-package; do echo "== $d"; cat "$d/SHA256SUMS"; done | tee out/REPORT.txt
          for d in out/sv-a out/sv-b out/c-per-package; do
            if diff -q out/workspace-mainnet/SHA256SUMS "$d/SHA256SUMS" >/dev/null; then echo "$d: IDENTICAL to the workspace build"; else echo "$d: DIFFERS from the workspace build"; fi
          done | tee -a out/REPORT.txt
          cat out/failures.txt 2>/dev/null | tee -a out/REPORT.txt || true
          cat out/REPORT.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifiable-build-${{ inputs.ref || github.sha }}
          path: out/
          retention-days: 90
