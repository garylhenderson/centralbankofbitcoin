# THE VERIFIABLE BUILD, ON A MACHINE THAT IS NOT OURS (2026-10-10).
#
# Explorers and wallets mark a program "verified" when OtterSec rebuilds it from
# this public repository in Solana's verifiable-build container and gets the
# deployed bytes exactly. So the bytes we deploy must be the bytes that container
# makes. This workflow builds all five programs inside it, on GitHub's runner,
# and FAILS unless three sets of bytes are one:
#   1. the whole workspace built in the container and stripped, exactly as
#      scripts/build-mainnet.sh builds dist/ on the box;
#   2. each program rebuilt alone through solana-verify (`-- --workspace`), as
#      OtterSec will rebuild it from the parameters uploaded on chain;
#   3. the audited hashes web/src/config.js records for the release build.
# The --features localnet workspace build the suite runs is built and published
# too, for comparison with the box. Run it by pushing a tag `verify-<short sha>`
# at the commit (or by hand); the report is the run summary and the artifact.
#
# Image: solanafoundation/solana-verifiable-build for Agave v4.1.0, whose
# Dockerfile installs cargo-build-sbf 4.1.0 with platform-tools v1.54: the exact
# toolchain scripts/run-tests.sh requires. The digest is solana-verify's own
# IMAGE_MAP entry for (4, 1, 0). It builds nothing that is deployed by itself.
name: verifiable-build
on:
  push:
    tags: ['verify-*']   # a pushed tag builds the commit it names
  workflow_dispatch:
    inputs:
      ref:
        description: commit to build
        required: true
permissions:
  contents: read
env:
  IMAGE: solanafoundation/solana-verifiable-build@sha256:6468b89ae21d87b8eb002f894ac3f3442dbd8bcf5ea93414051e96e00d03b5ab
  SOLANA_VERIFY_VERSION: 0.5.2
  LIBS: cbob_vaults cbob_vault_mint cbob_vault_burn cbob_vault_gov cbob_vault_sweep
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: record the commit
        run: git rev-parse HEAD | tee commit.txt
      - name: whole workspace in the container, stripped (as build-mainnet.sh builds dist/)
        run: |
          docker pull "$IMAGE"
          mkdir -p out/logs
          for f in mainnet localnet; do
            FEAT=""; [ "$f" = localnet ] && FEAT="--features localnet"
            docker run --rm -v "$PWD":/build -w /build -e CARGO_TARGET_DIR=/build/target-ws-$f "$IMAGE" \
              bash -c "cargo build-sbf --tools-version v1.54 --arch v3 $FEAT && mkdir -p out/workspace-$f && for so in target-ws-$f/sbpfv3-solana-solana/release/*.so; do \$HOME/.cache/solana/v1.54/platform-tools/llvm/bin/llvm-objcopy --strip-all \$so out/workspace-$f/\$(basename \$so); done" \
              > out/logs/ws-$f.log 2>&1 || { tail -40 out/logs/ws-$f.log; exit 1; }
          done
          docker run --rm "$IMAGE" bash -c "cargo build-sbf --version" | tee out/toolchain.txt
      - name: install solana-verify
        run: cargo install solana-verify --version "$SOLANA_VERIFY_VERSION" --locked
      - name: each program through solana-verify, as OtterSec will rebuild it (-- --workspace)
        run: |
          mkdir -p out/solana-verify
          for L in $LIBS; do
            sudo rm -rf target   # the container builds as root
            solana-verify build --library-name "$L" --base-image "$IMAGE" --arch v3 -- --workspace > out/logs/sv-$L.log 2>&1 || { tail -40 out/logs/sv-$L.log; exit 1; }
            cp "target/deploy/$L.so" out/solana-verify/
          done
      - name: "the gate: the audited hashes, the container build and solana-verify's rebuild are one set of bytes"
        run: |
          sudo chown -R "$(id -u):$(id -g)" out   # the container wrote out/workspace-* as root
          cp commit.txt out/
          for d in out/workspace-mainnet out/workspace-localnet out/solana-verify; do ( cd "$d" && sha256sum *.so ) > "$d/SHA256SUMS"; done
          # the audited mainnet hashes, as web/src/config.js records them (programBytes)
          node -e "import('./web/src/config.js').then(m=>{const o=Object.values((m.PROFILES.mainnet||{}).programBytes||{});if(!o.length)process.exit(3);console.log(o.map(v=>v.sha256+'  '+v.file).sort((a,b)=>a.slice(66).localeCompare(b.slice(66))).join('\\n'))})" > out/AUDITED-SHA256SUMS
          for d in out/workspace-mainnet out/workspace-localnet out/solana-verify; do echo "== $d"; cat "$d/SHA256SUMS"; done | tee out/REPORT.txt
          echo "== audited (web/src/config.js)" | tee -a out/REPORT.txt; cat out/AUDITED-SHA256SUMS | tee -a out/REPORT.txt
          ok=1
          diff out/workspace-mainnet/SHA256SUMS out/solana-verify/SHA256SUMS > /dev/null && echo "container build == solana-verify rebuild: IDENTICAL" | tee -a out/REPORT.txt || { echo "container build != solana-verify rebuild" | tee -a out/REPORT.txt; ok=0; }
          diff out/workspace-mainnet/SHA256SUMS out/AUDITED-SHA256SUMS > /dev/null && echo "container build == audited hashes: IDENTICAL" | tee -a out/REPORT.txt || { echo "container build != audited hashes" | tee -a out/REPORT.txt; ok=0; }
          cat out/REPORT.txt >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifiable-build-${{ inputs.ref || github.sha }}
          path: out/
          retention-days: 90
